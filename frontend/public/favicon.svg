<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#grad)" />
  
  <!-- Graduation Cap Top -->
  <polygon points="50,18 85,35 50,52 15,35" fill="#FFFFFF" />
  <!-- Cap Underband -->
  <polygon points="32,44 68,44 68,50 32,50" fill="#FFFFFF" />
  
  <!-- Stylized M Legs and Arches -->
  <!-- Left Column -->
  <rect x="20" y="55" width="12" height="28" rx="2" fill="#FFFFFF" />
  <!-- Right Column -->
  <rect x="68" y="55" width="12" height="28" rx="2" fill="#FFFFFF" />
  <!-- Left Diagonal -->
  <polygon points="28,55 50,75 50,83 23,59" fill="#FFFFFF" />
  <!-- Right Diagonal -->
  <polygon points="72,55 50,75 50,83 77,59" fill="#FFFFFF" />
  
  <!-- Tassel -->
  <circle cx="82" cy="54" r="3" fill="#FFFFFF" />
  <line x1="83" y1="36" x2="82" y2="52" stroke="#FFFFFF" stroke-width="2" />
</svg>