<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Emblem Gradient -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Subtle Tech Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#techGrad)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Modern Geometric 'M' Symbol -->
  <g filter="url(#glow)">
    <!-- Main M Flowing Path -->
    <path 
      d="M 124 370 V 172 C 124 154 139 140 157 140 C 170 140 182 148 187 160 L 256 300 L 325 160 C 330 148 342 140 355 140 C 373 140 388 154 388 172 V 370" 
      fill="none" 
      stroke="url(#techGrad)" 
      stroke-width="44" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Sparkle / Tech Dot Accent -->
    <circle cx="256" cy="380" r="18" fill="#38BDF8" />
  </g>
</svg>