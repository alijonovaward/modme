server {
    listen 80;
    server_name markaz.alijonovblog.uz;
    return 301 https://infoplatform.uz$request_uri;
}

server {
    listen 443 ssl;
    server_name markaz.alijonovblog.uz;

    # Reuses the cert already issued for this domain - do not delete it
    # (certbot filled these two lines in; keep whatever paths it wrote here).
    ssl_certificate /etc/letsencrypt/live/markaz.alijonovblog.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markaz.alijonovblog.uz/privkey.pem;

    return 301 https://infoplatform.uz$request_uri;
}
