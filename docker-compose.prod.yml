services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      - db
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.prod
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
  postgres_data:
